<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="./dashboards/animeiowa.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AnimeIowa | Create Account</title>

  <style>
    body { padding: 20px 16px 40px; }

    .wrap { width: 100%; max-width: 460px; }
    .header { text-align: center; margin-bottom: 16px; }

    .title {
      margin: 0;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #fff;
      text-shadow: 0 0 30px rgba(180,100,255,0.7);
    }

    .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 14px; }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media(min-width:520px) { .grid { grid-template-columns: 1fr 1fr; } }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .link {
      color: rgba(200,160,255,0.8);
      text-decoration: none;
      font-size: 14px;
      border-bottom: 1px dashed rgba(160,80,255,0.4);
      padding-bottom: 2px;
    }

    .btn { width: 100%; margin-top: 14px; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="header">
      <img src="./images/3-color.png" alt="AnimeIowa Logo" style="height:48px; width:auto; object-fit:contain; margin-bottom:12px;" />
      <h1 class="title">AnimeIowa</h1>
      <p class="subtitle">Create Account</p>
    </div>

    <div class="card">
      <form id="signupForm" autocomplete="on">
        <div class="grid">
          <div>
            <label for="firstName">First name</label>
            <input id="firstName" type="text" placeholder="First name" required />
          </div>
          <div>
            <label for="lastName">Last name</label>
            <input id="lastName" type="text" placeholder="Last name" required />
          </div>
        </div>

        <div class="grid">
          <div>
            <label for="nickname">Nickname (optional)</label>
            <input id="nickname" type="text" placeholder="Nickname" />
          </div>
          <div>
            <label for="badgeNumber">Badge # (optional)</label>
            <input id="badgeNumber" type="text" placeholder="Badge number" />
          </div>
        </div>

       <label for="email">Email</label>
<input id="email" type="email" placeholder="you@example.com" required />

<label for="emailConfirm">Confirm Email</label>
<input id="emailConfirm" type="email" placeholder="Type your email again" required />

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Create a password" required />

        <button id="createBtn" class="btn" type="submit">Create Account</button>

        <div id="message" class="msg" aria-live="polite"></div>

        <div class="row">
          <a class="link" href="index.html">Back to login</a>
          <a class="link" href="reset.html">Forgot password?</a>
        </div>
      </form>

      <div class="tiny">
        After you create an account, an admin may need to activate it before you can use the system.
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://mjnphetnuiuxgsghzdoo.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qbnBoZXRudWl1eGdzZ2h6ZG9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4OTA2OTMsImV4cCI6MjA4NzQ2NjY5M30.sB1i6dy5e7brQHRiCJ-0Kf2aIcIO1DkUR1O2RtkmRGc';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: {
    flowType: 'pkce',
    detectSessionInUrl: true
  }
});

    const form = document.getElementById('signupForm');
    const createBtn = document.getElementById('createBtn');
    const msgEl = document.getElementById('message');

    const firstNameEl = document.getElementById('firstName');
    const lastNameEl = document.getElementById('lastName');
    const nicknameEl = document.getElementById('nickname');
    const badgeNumberEl = document.getElementById('badgeNumber');
    const emailEl = document.getElementById('email');
const emailConfirmEl = document.getElementById('emailConfirm');
const passwordEl = document.getElementById('password');

    function setMsg(type, text) {
      msgEl.className = 'msg ' + (type || '');
      msgEl.textContent = text || '';
      msgEl.style.display = text ? 'block' : 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      setMsg('', '');

      const first_name = (firstNameEl.value || '').trim();
      const last_name = (lastNameEl.value || '').trim();
      const nickname = (nicknameEl.value || '').trim();
      const badge_number = (badgeNumberEl.value || '').trim();
     const email = (emailEl.value || '').trim();
const emailConfirm = (emailConfirmEl.value || '').trim();
const password = passwordEl.value || '';

if (!first_name || !last_name || !email || !emailConfirm || !password) {
  setMsg('error', 'Please fill out all fields.');
  return;
}

if (email !== emailConfirm) {
  setMsg('error', 'Your email addresses do not match. Please check and try again.');
  return;
}

      createBtn.disabled = true;
      createBtn.textContent = 'Creating…';

      try {
        // 1) Create Supabase Auth user
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) throw error;

        const authId = data?.user?.id;

        // 2) Create core_users profile row (best effort)
        // Default role = volunteer, is_active = false (admin activates later)
        if (authId) {
          const { error: profileErr } = await supabase
            .from('core_users')
            .insert([{
              auth_id: authId,
              first_name,
              last_name,
              nickname: nickname || null,
              badge_number: badge_number || null,
              role: 'volunteer',
              is_active: false
            }]);

          // If RLS blocks this insert, user still exists in Auth — admin can create profile row manually.
          if (profileErr) {
            setMsg(
              'ok',
              'Account created. If you cannot log in later, an admin may need to finish activating your profile.'
            );
            return;
          }
        }

        setMsg('ok', 'Account created! Redirecting to login…');
setTimeout(() => { window.location.href = 'index.html'; }, 2000);
      } catch (err) {
        setMsg('error', err?.message || 'Signup failed.');
      } finally {
        createBtn.disabled = false;
        createBtn.textContent = 'Create Account';
      }
    });
  </script>
<script type="module" src="./feedback.js" data-page="Sign Up"></script>
</body>
</html>
