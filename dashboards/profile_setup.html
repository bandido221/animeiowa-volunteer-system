<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="animeiowa.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AnimeIowa | Complete Profile</title>

  <style>
    :root {
      --bg: #000000;
      --card: rgba(255,255,255,0.06);
      --card-border: rgba(255,255,255,0.10);

      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.70);

      --danger: #ff6b6b;
      --ok: #7CFC90;

      --btn: #ffffff;
      --btnText: #000000;

      --inputBg: rgba(255,255,255,0.08);
      --inputBorder: rgba(255,255,255,0.14);
      --focus: rgba(255,255,255,0.28);
    }

    * { box-sizing: border-box; }
  html, body { min-height: 100%; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 20px 16px 40px;
}

    .wrap { width: 100%; max-width: 520px; }

    .header { text-align: center; margin-bottom: 20px; }
    .title { margin: 0; font-size: 26px; font-weight: 800; }
    .subtitle { margin: 8px 0 0 0; color: var(--muted); font-size: 14px; }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(10px);
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin: 14px 0 6px;
    }

    input, select {
      width: 100%;
      padding: 14px 12px;
      border-radius: 12px;
      border: 1px solid var(--inputBorder);
      background: var(--inputBg);
      color: var(--text);
      outline: none;
      font-size: 16px;
    }

    input:focus, select:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.08);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 520px) {
      .grid.two { grid-template-columns: 1fr 1fr; }
      .grid.three { grid-template-columns: 1fr 1fr 1fr; }
    }

    .btn {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: var(--btn);
      color: var(--btnText);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .msg {
      margin-top: 14px;
      font-size: 14px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      display: none;
    }
    .msg.error { color: var(--danger); display:block; }
    .msg.ok { color: var(--ok); display:block; }

    .tiny {
      margin-top: 14px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="header">
      <h1 class="title">Complete Your Profile</h1>
      <p class="subtitle">Fill this out so staff can assign your role and badge number.</p>
    </div>

    

    <div class="card">
      <form id="profileForm">
        <div class="grid two">
          <div>
            <label>First Name</label>
            <input id="first_name" type="text" required />
          </div>
          <div>
            <label>Last Name</label>
            <input id="last_name" type="text" required />
          </div>
        </div>

        <label>Nickname (optional)</label>
        <input id="nickname" type="text" />

        <label>Phone</label>
        <input id="phone" type="tel" inputmode="tel" placeholder="(555) 555-5555" />

        <label>Address</label>
        <input id="address" type="text" placeholder="Street address" />

        <div class="grid two">
          <div>
            <label>City</label>
            <input id="city" type="text" />
          </div>
          <div>
            <label>State</label>
            <select id="state">
              <option value="">Select</option>
              <option value="AL">AL</option><option value="AK">AK</option><option value="AZ">AZ</option><option value="AR">AR</option>
              <option value="CA">CA</option><option value="CO">CO</option><option value="CT">CT</option><option value="DE">DE</option>
              <option value="FL">FL</option><option value="GA">GA</option><option value="HI">HI</option><option value="ID">ID</option>
              <option value="IL">IL</option><option value="IN">IN</option><option value="IA">IA</option><option value="KS">KS</option>
              <option value="KY">KY</option><option value="LA">LA</option><option value="ME">ME</option><option value="MD">MD</option>
              <option value="MA">MA</option><option value="MI">MI</option><option value="MN">MN</option><option value="MS">MS</option>
              <option value="MO">MO</option><option value="MT">MT</option><option value="NE">NE</option><option value="NV">NV</option>
              <option value="NH">NH</option><option value="NJ">NJ</option><option value="NM">NM</option><option value="NY">NY</option>
              <option value="NC">NC</option><option value="ND">ND</option><option value="OH">OH</option><option value="OK">OK</option>
              <option value="OR">OR</option><option value="PA">PA</option><option value="RI">RI</option><option value="SC">SC</option>
              <option value="SD">SD</option><option value="TN">TN</option><option value="TX">TX</option><option value="UT">UT</option>
              <option value="VT">VT</option><option value="VA">VA</option><option value="WA">WA</option><option value="WV">WV</option>
              <option value="WI">WI</option><option value="WY">WY</option>
            </select>
          </div>
        </div>

        <label>ZIP</label>
        <input id="zip" type="text" inputmode="numeric" placeholder="12345 or 12345-6789" />

        <button id="saveBtn" class="btn" type="submit">Save Profile</button>

        <div id="message" class="msg"></div>

        <div class="tiny">
          After you save, an admin/staff member will activate your account and assign your role and badge number.
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

    const SUPABASE_URL = 'https://mjnphetnuiuxgsghzdoo.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qbnBoZXRudWl1eGdzZ2h6ZG9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4OTA2OTMsImV4cCI6MjA4NzQ2NjY5M30.sB1i6dy5e7brQHRiCJ-0Kf2aIcIO1DkUR1O2RtkmRGc';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    const form = document.getElementById('profileForm')
    const saveBtn = document.getElementById('saveBtn')
    const msgEl = document.getElementById('message')

    const firstNameEl = document.getElementById('first_name')
    const lastNameEl = document.getElementById('last_name')
    const nicknameEl = document.getElementById('nickname')
    const phoneEl = document.getElementById('phone')
    const addressEl = document.getElementById('address')
    const cityEl = document.getElementById('city')
    const stateEl = document.getElementById('state')
    const zipEl = document.getElementById('zip')

    

    function setMsg(type, text) {
      msgEl.className = 'msg ' + (type || '')
      msgEl.textContent = text || ''
      msgEl.style.display = text ? 'block' : 'none'
    }

    async function requireSession() {
      const { data, error } = await supabase.auth.getSession()
      if (error) throw error
      if (!data?.session) {
        window.location.href = '../index.html'
        return null
      }
      return data.session
    }

    async function loadExisting(authId) {
      const { data, error } = await supabase
        .from('core_users')
        .select('first_name,last_name,nickname,phone,address,city,state,zip')
        .eq('auth_id', authId)
        .maybeSingle()

      if (error) throw error
      return data
    }

    function fillForm(row) {
  if (!row) return
  firstNameEl.value = row.first_name || ''
  lastNameEl.value = row.last_name || ''
  nicknameEl.value = row.nickname || ''
  phoneEl.value = row.phone || ''
  addressEl.value = row.address || ''
  cityEl.value = row.city || ''
  stateEl.value = (row.state || '').toUpperCase()
  zipEl.value = row.zip || ''

  // Lock name fields if already set
  if (row.first_name) {
    firstNameEl.readOnly = true
    firstNameEl.style.opacity = '0.6'
  }
  if (row.last_name) {
    lastNameEl.readOnly = true
    lastNameEl.style.opacity = '0.6'
  }
}

    ;(async () => {
      try {
        const session = await requireSession()
        if (!session) return
        const authId = session.user.id
        const existing = await loadExisting(authId)
        fillForm(existing)
      } catch (e) {
        setMsg('error', e?.message || 'Failed to load profile.')
      }
    })()

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      setMsg('', '')

      const session = await requireSession()
      if (!session) return
      const authId = session.user.id
      const userEmail = session.user.email || ''

      const payload = {
        auth_id: authId,
        first_name: (firstNameEl.value || '').trim(),
        last_name: (lastNameEl.value || '').trim(),
        nickname: (nicknameEl.value || '').trim() || null,
        phone: (phoneEl.value || '').trim() || null,
        address: (addressEl.value || '').trim() || null,
        city: (cityEl.value || '').trim() || null,
        state: ((stateEl.value || '').trim().toUpperCase()) || null,
        zip: (zipEl.value || '').trim() || null,
      }

      if (!payload.first_name || !payload.last_name) {
        setMsg('error', 'First name and last name are required.')
        return
      }

      saveBtn.disabled = true
      saveBtn.textContent = 'Saving…'

      try {
        // upsert by auth_id (unique)
        const { error } = await supabase
          .from('core_users')
          .upsert(payload, { onConflict: 'auth_id' })

        if (error) throw error

        

        // Send email to all admins and staff (Full plan only)
        const { data: planCheck } = await supabase
          .from('core_users')
          .select('plan')
          .eq('auth_id', authId)
          .maybeSingle()
        const currentPlan = (planCheck?.plan || 'basic').toLowerCase()

        if (currentPlan === 'full') try {
          const { data: admins } = await supabase
            .from('core_users')
            .select('email')
            .in('role', ['admin', 'super_user', 'staff'])
            .eq('is_active', true)

          if (admins && admins.length > 0) {
            const adminEmails = admins.map(a => a.email).filter(Boolean)

            const photoHtml = payload.profile_image_url
              ? `<img src="${payload.profile_image_url}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;margin-bottom:12px;" />`
              : `<div style="width:80px;height:80px;border-radius:50%;background:#e5e5e5;display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:32px;">&#128100;</div>`

            const html = `
              <div style="font-family:Arial,sans-serif;max-width:480px;margin:0 auto;padding:24px;">
                <h2 style="margin:0 0 4px;">New Member Waiting for Activation</h2>
                <p style="color:#555;margin:0 0 20px;">A new member has completed their profile and is waiting to be activated.</p>
                <div style="text-align:center;margin-bottom:16px;">${photoHtml}</div>
                <table style="width:100%;border-collapse:collapse;">
                  <tr><td style="padding:8px 0;color:#777;font-size:13px;">Full Name</td><td style="padding:8px 0;font-weight:bold;">${payload.first_name} ${payload.last_name}</td></tr>
                  <tr><td style="padding:8px 0;color:#777;font-size:13px;">Email</td><td style="padding:8px 0;">${userEmail}</td></tr>
                  <tr><td style="padding:8px 0;color:#777;font-size:13px;">Phone</td><td style="padding:8px 0;">${payload.phone || '--'}</td></tr>
                </table>
                <p style="margin-top:20px;font-size:13px;color:#888;">Log into the AnimeIowa admin panel to activate this account.</p>
              </div>
            `

            await supabase.functions.invoke('send-email', {
              body: {
                to: adminEmails,
                subject: 'New member waiting for activation — AnimeIowa',
                html
              }
            })
          }
        } catch (_) { /* email failure is non-fatal */ }

        setMsg('ok', 'Saved. Please wait for staff to activate your account and assign your role.')
        setTimeout(async () => {
          try { await supabase.auth.signOut() } catch {}
          window.location.href = '../index.html'
        }, 1200)
      } catch (err) {
        setMsg('error', err?.message || 'Save failed.')
      } finally {
        saveBtn.disabled = false
        saveBtn.textContent = 'Save Profile'
      }
    })
  
  </script>
</body>
</html>
