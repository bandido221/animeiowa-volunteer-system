<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="animeiowa.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>AnimeIowa | Edit My Profile</title>

  <style>
    :root {
      --bg:#000;
      --card: rgba(255,255,255,0.06);
      --card-border: rgba(255,255,255,0.10);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.70);
      --danger: #ff6b6b;
      --ok: #7CFC90;
      --btn: #ffffff;
      --btnText: #000000;
      --btn2-bg: rgba(255,255,255,0.10);
      --btn2-border: rgba(255,255,255,0.16);
      --inputBg: rgba(255,255,255,0.08);
      --inputBorder: rgba(255,255,255,0.14);
      --focus: rgba(255,255,255,0.28);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px 16px 60px;
    }

    .wrap { width: 100%; max-width: 520px; margin: 0 auto; }

    .topbar-row {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
    }
    h1 { margin: 0; font-size: 22px; font-weight: 900; }

    .btn {
      appearance: none; border: none; border-radius: 12px;
      padding: 12px 18px; font-weight: 900; font-size: 14px;
      cursor: pointer; background: var(--btn); color: var(--btnText);
      line-height: 1; white-space: nowrap; display: inline-block;
    }
    .btn.secondary {
      background: var(--btn2-bg); color: var(--text);
      border: 1px solid var(--btn2-border); font-weight: 800;
    }
    .btn.full { width: 100%; text-align: center; margin-top: 18px; padding: 14px; font-size: 15px; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .card {
      background: var(--card); border: 1px solid var(--card-border);
      border-radius: 16px; padding: 20px; margin-bottom: 14px;
    }
    .card h2 { margin: 0 0 16px; font-size: 16px; font-weight: 900; }

    /* Avatar placeholder */
    .avatar-wrap { display: flex; justify-content: center; margin-bottom: 8px; }
    .avatar-circle {
      width: 80px; height: 80px; border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.14);
      display: flex; align-items: center; justify-content: center;
      font-size: 34px;
    }
    .avatar-note { text-align: center; font-size: 12px; color: var(--muted); }

    /* Locked fields */
    .field-locked {
      padding: 13px 12px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: var(--muted); font-size: 14px; margin-bottom: 10px;
    }
    .locked-label {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--muted); margin-bottom: 6px;
    }
    .lock-icon { font-size: 12px; opacity: 0.6; }

    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }

    input {
      width: 100%; padding: 13px 12px; border-radius: 12px;
      border: 1px solid var(--inputBorder); background: var(--inputBg);
      color: var(--text); font-size: 16px; outline: none;
      -webkit-appearance: none; appearance: none; margin-bottom: 10px;
    }
    input:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.08);
    }
    input[type="password"] { letter-spacing: 0.2em; }

    .passkey-row { display: flex; gap: 8px; align-items: flex-start; }
    .passkey-row input { margin-bottom: 0; flex: 1; }
    .passkey-toggle {
      appearance: none; border: 1px solid var(--btn2-border);
      border-radius: 10px; background: var(--btn2-bg);
      color: var(--text); font-size: 13px; font-weight: 700;
      padding: 13px 12px; cursor: pointer; white-space: nowrap;
      flex-shrink: 0;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 400px) { .grid-2 { grid-template-columns: 1fr; } }

    .msg {
      margin-top: 12px; font-size: 14px; line-height: 1.4;
      padding: 10px 12px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      display: none; word-break: break-word;
    }
    .msg.error { color: var(--danger); display: block; }
    .msg.ok    { color: var(--ok);     display: block; }

    .tiny { margin-top: 10px; font-size: 12px; color: var(--muted); line-height: 1.5; }
    .divider { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 16px 0; }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="topbar-row">
      <h1>Edit My Profile</h1>
      <button id="backBtn" class="btn secondary" type="button">Back</button>
    </div>

    <!-- Avatar card -->
    <div class="card">
      <h2>Profile Photo</h2>
      <div class="avatar-wrap">
        <div class="avatar-circle">&#128100;</div>
      </div>
      <p class="avatar-note">Profile photo coming soon.</p>
    </div>

    <!-- Info card -->
    <div class="card">
      <h2>My Information</h2>

      <div class="grid-2" style="margin-bottom:10px;">
        <div>
          <label for="first_name">First Name</label>
          <input id="first_name" type="text" />
        </div>
        <div>
          <label for="last_name">Last Name</label>
          <input id="last_name" type="text" />
        </div>
      </div>

      <label for="badge_number">Badge Number</label>
      <input id="badge_number" type="text" placeholder="e.g. V-1042" />

      <hr class="divider" />

      <label for="nickname">Nickname (optional)</label>
      <input id="nickname" type="text" placeholder="What should we call you?" />

      <div id="saveMsg" class="msg"></div>
      <button id="saveBtn" class="btn full" type="button">Save Changes</button>
    </div>

    <!-- Passkey card -->
    <div class="card">
      <h2>My Passkey</h2>
   <p class="tiny" style="margin-top:0;margin-bottom:14px;">
        Your 6-digit passkey is used to approve shifts at clock-out. You can update it here at any time.
      </p>

      <label for="passkey">New Passkey (6 digits)</label>
      <div class="passkey-row">
        <input id="passkey" type="password" inputmode="numeric" maxlength="6" placeholder="••••••" />
        <button class="passkey-toggle" type="button" id="passkeyToggle">Show</button>
      </div>

      <label for="passkey_confirm" style="margin-top:10px;">Confirm Passkey</label>
      <div class="passkey-row">
        <input id="passkey_confirm" type="password" inputmode="numeric" maxlength="6" placeholder="••••••" />
        <button class="passkey-toggle" type="button" id="passkeyConfirmToggle">Show</button>
      </div>

      <div id="passkeyMsg" class="msg"></div>
      <button id="passkeyBtn" class="btn full" type="button">Set Passkey</button>
    </div>

  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

    const SUPABASE_URL      = 'https://mjnphetnuiuxgsghzdoo.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qbnBoZXRudWl1eGdzZ2h6ZG9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4OTA2OTMsImV4cCI6MjA4NzQ2NjY5M30.sB1i6dy5e7brQHRiCJ-0Kf2aIcIO1DkUR1O2RtkmRGc';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let coreUser = null;

    const backBtn             = document.getElementById('backBtn');
    const saveBtn             = document.getElementById('saveBtn');
    const saveMsg             = document.getElementById('saveMsg');
    const passkeyBtn          = document.getElementById('passkeyBtn');
    const passkeyMsg          = document.getElementById('passkeyMsg');
    const passkeyEl           = document.getElementById('passkey');
    const passkeyConfirmEl    = document.getElementById('passkey_confirm');
    const passkeyToggle       = document.getElementById('passkeyToggle');
    const passkeyConfirmToggle= document.getElementById('passkeyConfirmToggle');

    function setMsg(el, type, text) {
      el.className = 'msg ' + (type || '');
      el.textContent = text || '';
      el.style.display = text ? 'block' : 'none';
    }

    // Show/hide passkey toggle
    function makeToggle(btn, input) {
      btn.addEventListener('click', () => {
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.textContent = show ? 'Hide' : 'Show';
      });
    }
    makeToggle(passkeyToggle, passkeyEl);
    makeToggle(passkeyConfirmToggle, passkeyConfirmEl);

    // Only allow digits in passkey fields
    [passkeyEl, passkeyConfirmEl].forEach(el => {
      el.addEventListener('input', () => {
        el.value = el.value.replace(/\D/g, '').slice(0, 6);
      });
    });

    async function load() {
      const { data, error } = await supabase.auth.getSession();
      if (error || !data?.session?.user?.id) {
        window.location.href = '../index.html'; return;
      }

      const { data: u, error: ue } = await supabase
        .from('core_users')
        .select('id, auth_id, first_name, last_name, nickname, badge_number, role, is_active')
        .eq('auth_id', data.session.user.id)
        .single();

      if (ue || !u || !u.is_active) {
        window.location.href = '../index.html'; return;
      }

      coreUser = u;

      document.getElementById('first_name').value  = u.first_name   || '';
      document.getElementById('last_name').value   = u.last_name    || '';
      document.getElementById('badge_number').value= u.badge_number || '';
      document.getElementById('nickname').value    = u.nickname     || '';
    }

    // Save nickname
    saveBtn.addEventListener('click', async () => {
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';
      setMsg(saveMsg, '', '');

      const payload = {
        first_name:   (document.getElementById('first_name').value   || '').trim() || null,
        last_name:    (document.getElementById('last_name').value    || '').trim() || null,
        badge_number: (document.getElementById('badge_number').value || '').trim() || null,
        nickname:     (document.getElementById('nickname').value     || '').trim() || null,
      };

      const { error } = await supabase
        .from('core_users')
        .update(payload)
        .eq('id', coreUser.id);

      if (error) {
        setMsg(saveMsg, 'error', error.message || 'Save failed.');
      } else {
        setMsg(saveMsg, 'ok', 'Saved!');
        setTimeout(() => setMsg(saveMsg, '', ''), 3000);
      }

      saveBtn.disabled = false;
      saveBtn.textContent = 'Save Changes';
    });

    // Set passkey
    passkeyBtn.addEventListener('click', async () => {
      const pk  = (passkeyEl.value || '').trim();
      const pkc = (passkeyConfirmEl.value || '').trim();

      if (!pk) {
        setMsg(passkeyMsg, 'error', 'Please enter a 6-digit passkey.'); return;
      }
      if (!/^\d{6}$/.test(pk)) {
        setMsg(passkeyMsg, 'error', 'Passkey must be exactly 6 digits.'); return;
      }
      if (pk !== pkc) {
        setMsg(passkeyMsg, 'error', 'Passkeys do not match.'); return;
      }

      passkeyBtn.disabled = true;
      passkeyBtn.textContent = 'Saving...';
      setMsg(passkeyMsg, '', '');

      const { error } = await supabase
        .from('core_users')
        .update({ passkey: pk })
        .eq('id', coreUser.id);

      if (error) {
        setMsg(passkeyMsg, 'error', error.message || 'Failed to save passkey.');
      } else {
        setMsg(passkeyMsg, 'ok', 'Passkey set successfully!');
        passkeyEl.value = '';
        passkeyConfirmEl.value = '';
        setTimeout(() => setMsg(passkeyMsg, '', ''), 4000);
      }

      passkeyBtn.disabled = false;
      passkeyBtn.textContent = 'Set Passkey';
    });

    backBtn.addEventListener('click', () => {
      const role = (coreUser?.role || '').toLowerCase();
      window.location.href = 'dashboard.html';
    });

    load().catch(() => { window.location.href = '../index.html'; });
  </script>
</body>
</html>
