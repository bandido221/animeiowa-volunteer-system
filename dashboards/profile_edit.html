<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="animeiowa.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>AnimeIowa | Edit My Profile</title>

  <style>
    :root {
      --bg:#000;
      --card: rgba(255,255,255,0.06);
      --card-border: rgba(255,255,255,0.10);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.70);
      --danger: #ff6b6b;
      --ok: #7CFC90;
      --btn: #ffffff;
      --btnText: #000000;
      --btn2-bg: rgba(255,255,255,0.10);
      --btn2-border: rgba(255,255,255,0.16);
      --inputBg: rgba(255,255,255,0.08);
      --inputBorder: rgba(255,255,255,0.14);
      --focus: rgba(255,255,255,0.28);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px 16px 60px;
    }

    .wrap { width: 100%; max-width: 520px; margin: 0 auto; }

    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 { margin: 0; font-size: 22px; font-weight: 900; }

    .btn {
      appearance: none; border: none; border-radius: 12px;
      padding: 12px 18px; font-weight: 900; font-size: 14px;
      cursor: pointer; background: var(--btn); color: var(--btnText);
      line-height: 1; white-space: nowrap; text-decoration: none;
      display: inline-block;
    }
    .btn.secondary {
      background: var(--btn2-bg); color: var(--text);
      border: 1px solid var(--btn2-border); font-weight: 800;
    }
    .btn.full { width: 100%; text-align: center; margin-top: 18px; padding: 14px; font-size: 15px; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .card {
      background: var(--card); border: 1px solid var(--card-border);
      border-radius: 16px; padding: 20px; margin-bottom: 14px;
    }
    .card h2 { margin: 0 0 16px; font-size: 16px; font-weight: 900; }

    /* Photo section */
    .photo-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }
    #photoPreview {
      width: 80px; height: 80px; border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; flex-shrink: 0;
      overflow: hidden;
    }
    #photoPreview img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .photo-btns { display: flex; flex-direction: column; gap: 8px; }

    /* Locked fields */
    .field-locked {
      padding: 13px 12px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: var(--muted); font-size: 14px;
      margin-bottom: 10px;
    }

    label {
      display: block; font-size: 13px;
      color: var(--muted); margin-bottom: 6px;
    }
    .locked-label {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--muted); margin-bottom: 6px;
    }
    .lock-icon { font-size: 12px; opacity: 0.6; }

    input, select {
      width: 100%; padding: 13px 12px; border-radius: 12px;
      border: 1px solid var(--inputBorder); background: var(--inputBg);
      color: var(--text); font-size: 16px; outline: none;
      -webkit-appearance: none; appearance: none; margin-bottom: 10px;
    }
    select { background: #fff; color: #000; }
    input:focus, select:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.08);
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

    .msg {
      margin-top: 12px; font-size: 14px; line-height: 1.4;
      padding: 10px 12px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      display: none; word-break: break-word;
    }
    .msg.error { color: var(--danger); display: block; }
    .msg.ok    { color: var(--ok);     display: block; }

    .tiny { margin-top: 12px; font-size: 12px; color: var(--muted); line-height: 1.5; }

    @media (max-width: 400px) {
      .grid-2 { grid-template-columns: 1fr; }
      .grid-3 { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="topbar-row">
      <h1>Edit My Profile</h1>
      <button id="backBtn" class="btn secondary" type="button">Back</button>
    </div>

    <!-- Photo card -->
    <div class="card">
      <h2>Profile Photo</h2>
      <div class="photo-wrap">
        <div id="photoPreview"><span id="photoPlaceholder" style="font-size:32px;">&#128100;</span></div>
        <div class="photo-btns">
          <button id="takePhotoBtn" class="btn secondary" type="button" style="font-size:13px; padding:9px 14px;">Take Photo</button>
          <button id="uploadPhotoBtn" class="btn secondary" type="button" style="font-size:13px; padding:9px 14px;">Upload Image</button>
          <button id="removePhotoBtn" class="btn secondary" type="button" style="font-size:13px; padding:9px 14px; color:var(--danger); display:none;">Remove</button>
        </div>
      </div>
      <input id="cameraInput" type="file" accept="image/*" capture="environment" style="display:none;" />
      <input id="fileInput"   type="file" accept="image/*" style="display:none;" />
      <div id="photoMsg" class="msg"></div>
    </div>

    <!-- Info card -->
    <div class="card">
      <h2>My Information</h2>

      <!-- Locked: name -->
      <div class="grid-2" style="margin-bottom:0;">
        <div>
          <div class="locked-label"><span class="lock-icon">&#128274;</span> First Name</div>
          <div class="field-locked" id="lockedFirstName">--</div>
        </div>
        <div>
          <div class="locked-label"><span class="lock-icon">&#128274;</span> Last Name</div>
          <div class="field-locked" id="lockedLastName">--</div>
        </div>
      </div>

      <!-- Locked: badge -->
      <div class="locked-label"><span class="lock-icon">&#128274;</span> Badge Number</div>
      <div class="field-locked" id="lockedBadge">Not assigned yet</div>

      <p class="tiny" style="margin-top:0; margin-bottom:16px;">Name and badge number are assigned by admin and cannot be changed here.</p>

      <!-- Editable fields -->
      <label for="nickname">Nickname (optional)</label>
      <input id="nickname" type="text" placeholder="What should we call you?" />

      <label for="phone">Phone</label>
      <input id="phone" type="tel" inputmode="tel" placeholder="(555) 555-5555" />

      <label for="address">Address</label>
      <input id="address" type="text" placeholder="Street address" />

      <div class="grid-3">
        <div style="grid-column: span 1;">
          <label for="city">City</label>
          <input id="city" type="text" />
        </div>
        <div>
          <label for="state">State</label>
          <select id="state">
            <option value="">--</option>
            <option>AL</option><option>AK</option><option>AZ</option><option>AR</option>
            <option>CA</option><option>CO</option><option>CT</option><option>DE</option>
            <option>FL</option><option>GA</option><option>HI</option><option>ID</option>
            <option>IL</option><option>IN</option><option>IA</option><option>KS</option>
            <option>KY</option><option>LA</option><option>ME</option><option>MD</option>
            <option>MA</option><option>MI</option><option>MN</option><option>MS</option>
            <option>MO</option><option>MT</option><option>NE</option><option>NV</option>
            <option>NH</option><option>NJ</option><option>NM</option><option>NY</option>
            <option>NC</option><option>ND</option><option>OH</option><option>OK</option>
            <option>OR</option><option>PA</option><option>RI</option><option>SC</option>
            <option>SD</option><option>TN</option><option>TX</option><option>UT</option>
            <option>VT</option><option>VA</option><option>WA</option><option>WV</option>
            <option>WI</option><option>WY</option>
          </select>
        </div>
        <div>
          <label for="zip">ZIP</label>
          <input id="zip" type="text" inputmode="numeric" placeholder="12345" />
        </div>
      </div>

      <button id="saveBtn" class="btn full" type="button">Save Changes</button>
      <div id="saveMsg" class="msg"></div>
    </div>

  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL      = 'https://mjnphetnuiuxgsghzdoo.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qbnBoZXRudWl1eGdzZ2h6ZG9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4OTA2OTMsImV4cCI6MjA4NzQ2NjY5M30.sB1i6dy5e7brQHRiCJ-0Kf2aIcIO1DkUR1O2RtkmRGc';
    const PROFILE_BUCKET    = 'core-user-profile';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let coreUser = null;

    // Elements
    const backBtn        = document.getElementById('backBtn');
    const photoPreview   = document.getElementById('photoPreview');
    const photoPlaceholder = document.getElementById('photoPlaceholder');
    const takePhotoBtn   = document.getElementById('takePhotoBtn');
    const uploadPhotoBtn = document.getElementById('uploadPhotoBtn');
    const removePhotoBtn = document.getElementById('removePhotoBtn');
    const cameraInput    = document.getElementById('cameraInput');
    const fileInput      = document.getElementById('fileInput');
    const photoMsg       = document.getElementById('photoMsg');
    const saveBtn        = document.getElementById('saveBtn');
    const saveMsg        = document.getElementById('saveMsg');

    function setMsg(el, type, text) {
      el.className = 'msg ' + (type || '');
      el.textContent = text || '';
      el.style.display = text ? 'block' : 'none';
    }

    // -- Auth guard --
    async function load() {
      const { data, error } = await supabase.auth.getSession();
      if (error || !data?.session?.user?.id) {
        window.location.href = 'index.html'; return;
      }

      const { data: u, error: ue } = await supabase
        .from('core_users')
        .select('*')
        .eq('auth_id', data.session.user.id)
        .single();

      if (ue || !u || !u.is_active) {
        window.location.href = 'index.html'; return;
      }

      coreUser = u;

      // Fill locked fields
      document.getElementById('lockedFirstName').textContent = u.first_name || '--';
      document.getElementById('lockedLastName').textContent  = u.last_name  || '--';
      document.getElementById('lockedBadge').textContent     = u.badge_number || 'Not assigned yet';

      // Fill editable fields
      document.getElementById('nickname').value = u.nickname || '';
      document.getElementById('phone').value    = u.phone    || '';
      document.getElementById('address').value  = u.address  || '';
      document.getElementById('city').value     = u.city     || '';
      document.getElementById('state').value    = u.state    || '';
      document.getElementById('zip').value      = u.zip      || '';

      // Photo
      setPhotoUi(u.profile_image_url);
    }

    function setPhotoUi(url) {
      photoPreview.innerHTML = '';
      if (url) {
        const img = document.createElement('img');
        img.src = url;
        img.alt = 'Profile photo';
        photoPreview.appendChild(img);
        removePhotoBtn.style.display = 'inline-block';
      } else {
        photoPreview.innerHTML = '<span style="font-size:32px;">&#128100;</span>';
        removePhotoBtn.style.display = 'none';
      }
    }

    // -- Image resizing --
    async function resizeImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          const MAX = 512;
          let w = img.naturalWidth, h = img.naturalHeight;
          if (w > h && w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
          else if (h > MAX)     { w = Math.round(w * MAX / h); h = MAX; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          canvas.toBlob(b => b ? resolve(b) : reject(new Error('Canvas toBlob failed')), 'image/jpeg', 0.85);
        };
        img.onerror = reject;
        img.src = url;
      });
    }

    async function uploadPhoto(file) {
      setMsg(photoMsg, '', 'Uploading...');
      try {
        const blob = await resizeImage(file);
        const path = `core_users/${coreUser.id}.jpg`;

        const { error: upErr } = await supabase.storage
          .from(PROFILE_BUCKET)
          .upload(path, blob, { upsert: true, contentType: 'image/jpeg' });
        if (upErr) throw upErr;

        const { data: urlData } = supabase.storage.from(PROFILE_BUCKET).getPublicUrl(path);
        const publicUrl = urlData?.publicUrl;
        if (!publicUrl) throw new Error('Could not get public URL.');

        // Add cache-buster so the new photo shows immediately
        const displayUrl = publicUrl + '?t=' + Date.now();

        const { error: dbErr } = await supabase
          .from('core_users')
          .update({ profile_image_url: publicUrl })
          .eq('id', coreUser.id);
        if (dbErr) throw dbErr;

        coreUser.profile_image_url = publicUrl;
        setPhotoUi(displayUrl);
        setMsg(photoMsg, 'ok', 'Photo updated!');
        setTimeout(() => setMsg(photoMsg, '', ''), 3000);
      } catch (e) {
        setMsg(photoMsg, 'error', e?.message || 'Upload failed.');
      }
    }

    // -- Photo button events --
    takePhotoBtn.addEventListener('click', () => cameraInput.click());
    uploadPhotoBtn.addEventListener('click', () => fileInput.click());

    cameraInput.addEventListener('change', () => {
      if (cameraInput.files[0]) uploadPhoto(cameraInput.files[0]);
      cameraInput.value = '';
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) uploadPhoto(fileInput.files[0]);
      fileInput.value = '';
    });

    removePhotoBtn.addEventListener('click', async () => {
      removePhotoBtn.disabled = true;
      try {
        const { error } = await supabase
          .from('core_users')
          .update({ profile_image_url: null })
          .eq('id', coreUser.id);
        if (error) throw error;
        coreUser.profile_image_url = null;
        setPhotoUi(null);
        setMsg(photoMsg, 'ok', 'Photo removed.');
        setTimeout(() => setMsg(photoMsg, '', ''), 3000);
      } catch (e) {
        setMsg(photoMsg, 'error', e?.message || 'Failed to remove photo.');
      } finally {
        removePhotoBtn.disabled = false;
      }
    });

    // -- Save profile --
    saveBtn.addEventListener('click', async () => {
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';
      setMsg(saveMsg, '', '');

      const payload = {
        nickname: (document.getElementById('nickname').value || '').trim() || null,
        phone:    (document.getElementById('phone').value    || '').trim() || null,
        address:  (document.getElementById('address').value  || '').trim() || null,
        city:     (document.getElementById('city').value     || '').trim() || null,
        state:    (document.getElementById('state').value    || '').trim().toUpperCase() || null,
        zip:      (document.getElementById('zip').value      || '').trim() || null,
      };

      const { error } = await supabase
        .from('core_users')
        .update(payload)
        .eq('id', coreUser.id);

      if (error) {
        setMsg(saveMsg, 'error', error.message || 'Save failed.');
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Changes';
      } else {
        setMsg(saveMsg, 'ok', 'Saved! Taking you back...');
        const role = (coreUser?.role || '').toLowerCase();
        setTimeout(() => {
          window.location.href = role === 'staff' ? 'staff.html' : 'volunteer.html';
        }, 1200);
      }
    });

    // -- Back button: go to whichever dashboard they came from --
    backBtn.addEventListener('click', () => {
      const role = (coreUser?.role || '').toLowerCase();
      if (role === 'staff') {
        window.location.href = 'staff.html';
      } else {
        window.location.href = 'volunteer.html';
      }
    });

    load().catch(e => {
      console.error(e);
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
