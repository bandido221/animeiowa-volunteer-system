<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="./dashboards/animeiowa.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AnimeIowa | Reset Password</title>

  <style>
    body {
      display: grid;
      place-items: center;
      padding: 20px;
      min-height: 100vh;
    }

    .wrap { width: 100%; max-width: 420px; }
    .header { text-align: center; margin-bottom: 16px; }

    .title {
      margin: 0;
      font-size: 22px;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 20px rgba(180,100,255,0.6);
    }

    .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.4; }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .link {
      color: rgba(200,160,255,0.8);
      text-decoration: none;
      font-size: 14px;
      border-bottom: 1px dashed rgba(160,80,255,0.4);
      padding-bottom: 2px;
    }

    .btn { width: 100%; margin-top: 14px; }
  </style>
</head>

<body>
  <div class="wrap">
   <div class="header">
      <img src="./images/3-color.png" alt="AnimeIowa Logo" style="height:48px; width:auto; object-fit:contain; margin-bottom:12px;" />
      <h1 class="title">Reset Password</h1>
      <p id="subtitle" class="subtitle">Enter your email and we'll send a reset link.</p>
    </div>

    <div class="card">
      <!-- REQUEST RESET EMAIL -->
      <form id="requestForm">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" required />

        <button id="sendBtn" class="btn" type="submit">Send Reset Link</button>

        <div id="message" class="msg" aria-live="polite"></div>

        <div class="row">
          <a class="link" href="index.html">Back to login</a>
          <a class="link" href="signup.html">Create account</a>
        </div>

        <div class="tiny">
          If you don’t see the email, check your spam folder.
        </div>
      </form>

      <!-- SET NEW PASSWORD (shown only after user clicks email link) -->
      <form id="newPassForm" style="display:none;">
        <label for="newPassword">New password</label>
        <input id="newPassword" type="password" placeholder="New password" required />

        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" type="password" placeholder="Confirm password" required />

        <button id="updateBtn" class="btn" type="submit">Update Password</button>

        <div id="message2" class="msg" aria-live="polite"></div>

        <div class="row">
          <a class="link" href="index.html">Back to login</a>
        </div>

        <div class="tiny">
          After updating, return to login and sign in with your new password.
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://mjnphetnuiuxgsghzdoo.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qbnBoZXRudWl1eGdzZ2h6ZG9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4OTA2OTMsImV4cCI6MjA4NzQ2NjY5M30.sB1i6dy5e7brQHRiCJ-0Kf2aIcIO1DkUR1O2RtkmRGc';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { flowType: 'pkce', detectSessionInUrl: true }
});

    const requestForm = document.getElementById('requestForm');
    const newPassForm = document.getElementById('newPassForm');

    const emailEl = document.getElementById('email');
    const sendBtn = document.getElementById('sendBtn');
    const msgEl = document.getElementById('message');

    const subtitleEl = document.getElementById('subtitle');

    const newPasswordEl = document.getElementById('newPassword');
    const confirmPasswordEl = document.getElementById('confirmPassword');
    const updateBtn = document.getElementById('updateBtn');
    const msg2El = document.getElementById('message2');

    function setMsg(el, type, text) {
      el.className = 'msg ' + (type || '');
      el.textContent = text || '';
      el.style.display = text ? 'block' : 'none';
    }

    // If Supabase sends a "code" in the URL, exchange it for a session so updateUser works.
    async function tryEnterRecoveryMode() {
      const params = new URLSearchParams(window.location.search);
      const errorCode = params.get('error_code');
      if (errorCode) {
        setMsg(msgEl, 'error', 'This reset link has expired. Please request a new one.');
        return false;
      }

      const code = params.get('code');
      if (!code) return false;

      const { error } = await supabase.auth.exchangeCodeForSession(code);
      if (error) {
        setMsg(msgEl, 'error', 'Reset link is invalid or expired. Please request a new one.');
        return false;
      }

      requestForm.style.display = 'none';
      newPassForm.style.display = 'block';
      subtitleEl.textContent = 'Enter your new password.';
      return true;
    }

    await tryEnterRecoveryMode();

    // 1) Send recovery email
    requestForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      setMsg(msgEl, '', '');

      const email = (emailEl.value || '').trim();
      if (!email) {
        setMsg(msgEl, 'error', 'Please enter your email.');
        return;
      }

      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending…';

      try {
        // IMPORTANT: Must be hosted (http://localhost or real domain). file:// will NOT work.
        // Redirect back to this same page to set a new password.
        const redirectTo = 'https://bandido221.github.io/animeiowa-volunteer-system/reset.html';

        const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo });
        if (error) throw error;

        setMsg(msgEl, 'ok', 'Reset link sent. Check your email.');
      } catch (err) {
        setMsg(msgEl, 'error', err?.message || 'Failed to send reset link.');
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send Reset Link';
      }
    });

    // 2) Update password after recovery link
    newPassForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      setMsg(msg2El, '', '');

      const p1 = newPasswordEl.value || '';
      const p2 = confirmPasswordEl.value || '';

      if (!p1 || p1.length < 8) {
        setMsg(msg2El, 'error', 'Password must be at least 8 characters.');
        return;
      }
      if (p1 !== p2) {
        setMsg(msg2El, 'error', 'Passwords do not match.');
        return;
      }

      updateBtn.disabled = true;
      updateBtn.textContent = 'Updating…';

      try {
        const { error } = await supabase.auth.updateUser({ password: p1 });
        if (error) throw error;

        setMsg(msg2El, 'ok', 'Password updated. You can now return to login.');
        // Optional: sign out recovery session
        await supabase.auth.signOut();
      } catch (err) {
        setMsg(msg2El, 'error', err?.message || 'Failed to update password.');
      } finally {
        updateBtn.disabled = false;
        updateBtn.textContent = 'Update Password';
      }
    });
  </script>
<script type="module" src="./feedback.js" data-page="Reset Password"></script>
</body>
</html>
